# ============================================================
#  코인 자동매매 설정 파일  (이 파일만 고치면 됩니다)
#  - '#' 으로 시작하는 줄은 설명입니다.
#  - 숫자를 바꾼 뒤에는 꼭 먼저 백테스트로 확인하세요:
#        python main.py backtest
# ============================================================

# ── 기본 설정 ───────────────────────────────────────────────
exchange: upbit          # upbit, bithumb, binance 등 (ccxt 가 지원하는 거래소 이름)
symbol: BTC/KRW          # 거래할 코인. 예) BTC/KRW, ETH/KRW, BTC/USDT
timeframe: 1d            # 캔들 단위: 1m 5m 15m 30m 1h 4h 1d
timezone: Asia/Seoul     # '하루'를 나누는 기준 시간대 (일일 손실 한도 계산용)
capital: 1000000         # 봇이 쓸 수 있는 돈 (거래소 통화 기준, 예: 100만원)
                         #   → 계좌에 돈이 더 많아도 봇은 이 금액 안에서만 거래합니다.
poll_seconds: 10         # 봇이 몇 초마다 가격을 확인할지

# ── 매매 전략 선택 ──────────────────────────────────────────
# 아래 중 하나를 고르세요.
#   volatility_breakout : 변동성 돌파 (오늘 시가 + k × 어제 변동폭 을 넘으면 매수, 캔들 끝에 매도)
#   ma_cross            : 이동평균선(MA) 골든크로스 매수 / 데드크로스 매도
#   ema_cross           : 지수이동평균선(EMA) 골든크로스 매수 / 데드크로스 매도
#   rsi_reversion       : RSI 과매도에서 매수 / 회복되면 매도
strategy: volatility_breakout

# 추세 필터: 직전 종가가 N-캔들 이동평균 위에 있을 때만 '새로 매수'합니다.
# 하락장에서 매수를 피하는 용도. 0 이면 끔.   (예: 일봉 5 또는 20, 시간봉 200)
trend_filter_ma: 5

# 전략별 세부 숫자
strategy_params:
  volatility_breakout:
    k: 0.5               # 클수록 매수가 까다로워짐 (0.3 ~ 0.7 많이 씀)
  ma_cross:
    fast: 5              # 단기 이동평균 기간
    slow: 20             # 장기 이동평균 기간
  ema_cross:
    fast: 12
    slow: 26
  rsi_reversion:
    period: 14
    oversold: 30         # RSI 가 이 값 아래면 매수
    exit_level: 55       # RSI 가 이 값 이상이면 매도

# ── 리스크 관리 ─────────────────────────────────────────────
# 0 으로 두면 그 기능은 꺼집니다.
risk:
  max_position_pct: 50       # 한 번에 전체 자산의 최대 몇 %까지 매수할지
  risk_per_trade_pct: 1      # 손절 시 전체 자산의 몇 %까지만 잃도록 매수 금액을 자동 조절
                             #   (예: 손절 3%, 위험 1% → 자산의 약 33% 만 매수)
  stop_loss_pct: 3           # 매수가 대비 -3% 에서 손절
  take_profit_pct: 0         # 매수가 대비 +N% 에서 익절 (0=끔, 전략의 매도 신호를 따름)
  trailing_stop_pct: 0       # 매수 후 최고가 대비 -N% 하락하면 매도 (0=끔)
  max_daily_loss_pct: 3      # 하루 손실이 자산의 N% 에 닿으면 그날은 신규 매수 중단
  max_drawdown_pct: 20       # 자산이 최고점 대비 -N% 가 되면 전량 매도하고 봇 정지
  max_trades_per_day: 5      # 하루 최대 매수 횟수
  cooldown_candles: 1        # 손절 후 N 캔들 동안 재매수 금지
  min_order_value: 5000      # 최소 주문 금액 (업비트 KRW = 5000, 바이낸스 USDT ≈ 10)

# ── 수수료 / 슬리피지 (백테스트와 모의투자에 반영) ───────────────
costs:
  fee_pct: 0.05              # 거래 수수료 (업비트 원화마켓 0.05%)
  slippage_pct: 0.05         # 주문 시 불리하게 체결되는 정도 (보수적으로 잡으세요)

# ── 백테스트 ────────────────────────────────────────────────
backtest:
  days: 365                  # 과거 며칠 치 데이터로 시험할지
